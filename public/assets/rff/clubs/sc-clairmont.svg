        <text x="256" y="201" text-anchor="middle" fill="#ffffff" font-family="'Arial Black', 'Plus Jakarta Sans', sans-serif" font-size="56" font-weight="900">SCC</text>
        
    <g>
      <circle cx="256" cy="420" r="27" fill="#ffffff" stroke="#eab308" stroke-width="3.0" />
      <line x1="256.0" y1="410.3" x2="256.0" y2="395.2" stroke="#111827" stroke-width="2.3" stroke-linecap="round" /><line x1="265.2" y1="417.0" x2="279.6" y2="412.3" stroke="#111827" stroke-width="2.3" stroke-linecap="round" /><line x1="261.7" y1="427.9" x2="270.6" y2="440.1" stroke="#111827" stroke-width="2.3" stroke-linecap="round" /><line x1="250.3" y1="427.9" x2="241.4" y2="440.1" stroke="#111827" stroke-width="2.3" stroke-linecap="round" /><line x1="246.8" y1="417.0" x2="232.4" y2="412.3" stroke="#111827" stroke-width="2.3" stroke-linecap="round" />
