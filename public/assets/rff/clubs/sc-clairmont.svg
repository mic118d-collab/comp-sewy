  <path d="M 90,76 Q 256,32 422,76 V 266 C 422,368 256,466 256,466 C 256,466 90,368 90,266 Z" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3" stroke-linejoin="round" />
