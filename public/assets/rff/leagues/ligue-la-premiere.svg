  <path d="M250,164 C266,154 286,164 286,182 C298,180 304,193 293,204 L308,211 L290,220 C290,246 273,266 248,270 L260,294 H235 L242,270 C218,266 205,244 212,218 C221,233 238,231 244,216 C237,198 239,175 250,164 Z" fill="url(#llp-gold)" stroke="#081229" stroke-width="3.5" stroke-linejoin="round" />
  
    <g>
      <circle cx="256" cy="324" r="24" fill="#ffffff" stroke="#081229" stroke-width="3.0" />
      <line x1="256.0" y1="315.4" x2="256.0" y2="301.9" stroke="#0b1d42" stroke-width="2.0" stroke-linecap="round" /><line x1="264.2" y1="321.3" x2="277.0" y2="317.2" stroke="#0b1d42" stroke-width="2.0" stroke-linecap="round" /><line x1="261.1" y1="331.0" x2="269.0" y2="341.9" stroke="#0b1d42" stroke-width="2.0" stroke-linecap="round" /><line x1="250.9" y1="331.0" x2="243.0" y2="341.9" stroke="#0b1d42" stroke-width="2.0" stroke-linecap="round" /><line x1="247.8" y1="321.3" x2="235.0" y2="317.2" stroke="#0b1d42" stroke-width="2.0" stroke-linecap="round" />
